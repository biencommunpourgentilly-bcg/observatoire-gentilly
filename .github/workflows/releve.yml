# Chaque nuit : récupère les réponses du relevé et les commentaires validés (feuille Google),
# recalcule les résultats anonymes et les publie. Inactif tant que les secrets RELEVE_URL et
# RELEVE_CLE ne sont pas définis (voir collecte/LISEZMOI.md).
name: Relevé de la pleine terre

on:
  schedule:
    - cron: "30 2 * * *"   # chaque nuit à 2 h 30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  releve:
    runs-on: ubuntu-latest
    env:
      RELEVE_URL: ${{ secrets.RELEVE_URL }}
      RELEVE_CLE: ${{ secrets.RELEVE_CLE }}
    steps:
      - uses: actions/checkout@v4
        if: env.RELEVE_URL != ''
      - uses: actions/setup-python@v5
        if: env.RELEVE_URL != ''
        with:
          python-version: "3.12"
      - name: Regrouper les réponses
        if: env.RELEVE_URL != ''
        run: python scripts/traiter_releve.py
      - name: Publier les résultats
        if: env.RELEVE_URL != ''
        run: |
          git config user.name "observatoire-bot"
          git config user.email "observatoire-bot@users.noreply.github.com"
          git add data/releve_pleine_terre.js data/releve_pleine_terre.json data/commentaires.js
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Relevé de la pleine terre : résultats du $(date +%Y-%m-%d)"
            git push
          fi
