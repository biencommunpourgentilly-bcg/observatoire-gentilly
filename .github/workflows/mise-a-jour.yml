# Met à jour les données chaque mois, après la publication mensuelle de Sitadel (fin de mois).
name: Mise à jour des données Sitadel

on:
  schedule:
    - cron: "0 6 3 * *"   # le 3 de chaque mois à 6 h UTC
  workflow_dispatch:       # lancement manuel depuis l'onglet « Actions »

permissions:
  contents: write

jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Pillow (mesure de la végétation)
        run: pip install pillow
      - name: Télécharger et préparer les données
        run: python scripts/maj_donnees.py
      - name: Enregistrer les changements
        run: |
          git config user.name "observatoire-bot"
          git config user.email "observatoire-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucune nouvelle donnée."
          else
            git commit -m "Données Sitadel : mise à jour du $(date +%Y-%m-%d)"
            git push
          fi
